<body><main><header><div class="brand">TIBO.RESET? / LITTLE CIVILIZATIONS</div><h1>tiboっち <span>: civilization</span></h1><p>節約する？ それとも全力で発展する？<br />働き方を選んだら、あとは小さな街の暮らしを見守ろう。</p></header><div id="civilization"></div><footer>これはウィジェットの単独プレビューです。実際の告知フィードは未接続のため、接続待ちと表示します。<br />「2分で体験する」では、独立したサンプルの文明を遊べます。<a href="https://github.com/tibo-openai" target="_blank" rel="noopener noreferrer">Tiboの公開プロフィール写真</a>を使用した非公式ファンゲームです。</footer></main>
<script type="module">
  import { mountCivilization } from "./widget.js";
  const widget = mountCivilization(document.querySelector("#civilization"), {
    snapshot: { notices: [], confirmedThrough: null, status: "unavailable", forecast: null },
    assetBase: new URL("../assets/", import.meta.url).href,
  });
  window.addEventListener("pagehide", () => widget.destroy(), { once: true });
</script></body>
